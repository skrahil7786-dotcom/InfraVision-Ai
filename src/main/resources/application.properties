# ==============================================================================
# InfraVision AI - Spring Boot Application Properties
# Smart India Hackathon (SIH 2026) Backend Configuration
# ==============================================================================

spring.application.name=infravision-ai
server.port=3000

# Database Configuration (PostgreSQL / H2)
spring.datasource.url=jdbc:postgresql://localhost:5432/infravision
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Database Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# JWT Security
jwt.secret=infravision-sih2026-super-secure-jwt-token-secret-key-32bytes
jwt.expiration=86400000
